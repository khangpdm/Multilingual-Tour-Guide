name: Mobile App CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint, Type Check & Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/MobileApp

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/MobileApp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Style & Lint
        run: npm run lint

      - name: Type Check TypeScript
        run: npx tsc --noEmit
